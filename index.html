<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인플루언서 추천 명단 | Siriai</title>
<style>
:root{color-scheme:light;--ink:#212622;--muted:#555e55;--paper:#f6f7f2;--line:#d9ddd4;--green:#244638}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Pretendard","Malgun Gothic",sans-serif}
a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid #478069;outline-offset:4px}
.wrap{width:min(1120px,calc(100% - 48px));margin:auto}header{border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;align-items:center;min-height:74px;gap:18px}
.wordmark{font:bold 29px Georgia,serif;text-decoration:none}.wordmark{display:inline-flex;align-items:center;gap:11px}.wordmark img{display:block;height:29px;width:auto}.wordmark img:first-child{height:28px}header nav a{font-size:14px;font-weight:700;text-underline-offset:4px}main{padding:54px 0 60px}
h1,h2,p{margin:0}h1{font-size:clamp(34px,6vw,65px);line-height:1.15;letter-spacing:-.055em}h2{font-size:25px;letter-spacing:-.04em}
.intro{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:28px}.eyebrow{color:var(--green);font-weight:700;margin-bottom:9px}.count,.meta{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:23px 16px}
.tile{display:block;text-decoration:none;background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.tile:hover{border-color:var(--green)}.tile img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#e0e6db}.tile div{padding:12px 13px}.tile strong,.tile span{display:block;overflow-wrap:anywhere}.tile strong{line-height:1.25;margin-bottom:5px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.pager.bottom{margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.button{display:inline-block;text-decoration:none;color:var(--green);font-weight:700;font-size:14px;padding:8px 13px;background:white;border:1px solid var(--line);border-radius:8px}.button:hover{border-color:var(--green)}.button[aria-disabled]{opacity:.45}
.profile{display:grid;grid-template-columns:minmax(210px, .72fr) minmax(0,1fr);align-items:center;gap:clamp(22px,6vw,76px);background:#e6ece2;border-radius:20px;overflow:hidden}.portrait{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#dce5d9}.bio{padding:28px 32px 28px 0}.bio h1{overflow-wrap:anywhere}.details{display:flex;flex-wrap:wrap;gap:7px 17px;margin:12px 0 25px}.details a{text-underline-offset:4px;overflow-wrap:anywhere}.reason{border-top:1px solid #bac7ba;padding-top:17px}.reason h2{font-size:18px;margin-bottom:6px}.reason p{max-width:43ch}
.reels{margin-top:40px}.reel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(205px,100%),1fr));gap:16px;max-width:860px;margin-top:15px}.reel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.reel video,.reel iframe{display:block;width:100%;aspect-ratio:9/16;background:#17211b;border:0}.reel-body{padding:12px 14px}.reel-body strong,.reel-body a{display:block}.reel-body a{font-size:14px;text-underline-offset:4px;margin-top:5px}.reel button{cursor:pointer;font:inherit;font-weight:700;color:white;background:#283f34;border:0;width:100%;aspect-ratio:9/16}.reel button:hover{background:#355648}.note{margin-top:12px;color:var(--muted);font-size:14px}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:570px){.wrap{width:calc(100% - 30px)}main{padding-top:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.intro{align-items:start;flex-direction:column;gap:8px}.profile{grid-template-columns:1fr;gap:0}.portrait{aspect-ratio:1;object-position:center 40%}.bio{padding:23px 19px}.reel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.reel-body{padding:9px}.reel button{font-size:14px}}
.detail-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;align-items:start}
.detail-layout>nav{position:sticky;top:16px}
.directory{padding:12px;background:white;border:1px solid var(--line);border-radius:12px}
.directory summary{font-weight:700;cursor:pointer;padding:5px 4px 10px}
.directory-list{list-style:none;padding:0;margin:0;max-height:min(70vh,620px);overflow:auto}
.directory-list a{display:flex;align-items:center;gap:9px;text-decoration:none;padding:6px;border-radius:7px}
.directory-list a:hover,.directory-list a[aria-current=page]{background:#e6ece2}
.directory-list a[aria-current=page]{font-weight:700;color:var(--green)}
.directory-list img{width:33px;height:38px;object-fit:cover;border-radius:5px;flex:none}
.directory-list span{overflow-wrap:anywhere;font-size:14px}
.tile-price{margin-top:6px;font-size:14px;color:var(--green);font-weight:700}
.terms{display:grid;gap:8px;margin-top:17px;padding:12px 0 0;border-top:1px solid #bac7ba;font-size:14px}
.terms p,.tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.terms strong{font-size:18px}.terms a{text-underline-offset:4px}
.tag{border:1px solid #bac7ba;border-radius:20px;background:#f4f7f2;padding:2px 8px}
.badge{background:#fff3ea;border-color:#e9cdb7;color:#823b20}
@media(max-width:780px){.detail-layout{grid-template-columns:1fr;gap:14px}.detail-layout>nav{position:static}.directory-list{max-height:260px}}
</style>

const content = document.querySelector('#content');
const heading = '인플루언서 추천 명단';
const campaign = '이정재 배우님 브랜드';
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const route = person => '#' + encodeURIComponent(person.handle);
const linkAttrs = 'target="_blank" rel="noopener noreferrer"';
const formatter = new Intl.NumberFormat('ko-KR',{notation:'compact',maximumFractionDigits:1});
const count = person => formatter.format(person.followers);
const won = new Intl.NumberFormat('ko-KR',{style:'currency',currency:'KRW',maximumFractionDigits:0});
function renderList() {
  content.innerHTML = `<section class="intro"><div><p class="eyebrow">${campaign}</p><h1>${heading}</h1></div><p class="count">총 ${creators.length}명</p></section>
    <div class="grid">${creators.map(person => `<a class="tile" href="${route(person)}"><img loading="lazy" src="${esc(person.cover)}" alt=""><div><strong>${esc(person.name)}</strong><span class="meta">@${esc(person.handle)} · ${count(person)}</span><span class="tile-price">${won.format(person.price)}</span></div></a>`).join('')}</div>`;
}
function directory(person) {
  return `<nav aria-label="인플루언서 목록"><details class="directory" ${window.innerWidth>780?'open':''}>
    <summary>인플루언서 목록 · ${creators.length}명</summary>
    <ul class="directory-list">${creators.map(item=>`<li><a href="${route(item)}"${item===person?' aria-current="page"':''}><img loading="lazy" src="${esc(item.cover)}" alt=""><span>${esc(item.name)}</span></a></li>`).join('')}</ul>
  </details></nav>`;
}
function pager(index, bottom = false) {
  const adjacent = (person,label) => person ? `<a class="button" href="${route(person)}">${label}</a>` : `<span class="button" aria-disabled="true">${label}</span>`;
  return `<nav class="pager ${bottom ? 'bottom' : ''}" aria-label="${bottom ? '하단' : '상단'} 프로필 이동">${adjacent(creators[index-1],'이전')}<a class="button" href="#">목록 · ${index+1}/${creators.length}</a>${adjacent(creators[index+1],'다음')}</nav>`;
}
function reelCard(url,label,person) {
  return `<article class="reel">${person?.video ? `<video controls playsinline preload="none" src="${esc(person.video)}" poster="${esc(person.poster || person.cover)}" aria-label="${esc(label)}"></video>` : `<button type="button" data-reel="${esc(url)}">릴스 재생</button>`}
  <div class="reel-body"><strong>${esc(label)}</strong><a href="${esc(url)}" ${linkAttrs}>인스타그램 원본</a></div></article>`;
}
function renderProfile(person,index) {
  const cards = [reelCard(person.reel,person.label,person),...person.extras.map((url,i)=>reelCard(url,'추가 릴스 '+(i+1)))];
  content.innerHTML = `<div class="detail-layout">${directory(person)}<div>${pager(index)}<article class="profile"><img class="portrait" src="${esc(person.cover)}" alt="${esc(person.name)} 대표 이미지">
    <div class="bio"><p class="eyebrow">${campaign} · 추천 크리에이터</p><h1>${esc(person.name)}</h1>
    <div class="details"><a href="https://www.instagram.com/${encodeURIComponent(person.handle)}/" ${linkAttrs}>@${esc(person.handle)}</a><span>팔로워 <strong title="${person.followers.toLocaleString('ko-KR')}명">${count(person)}</strong></span></div>
    <section class="reason"><h2>추천 이유</h2><p>${esc(person.reason)}</p></section>
    <div class="terms" aria-label="기존 명단의 진행 정보">
      <div class="tags">${person.note?`<span class="tag">${esc(person.note)}</span>`:''}${person.badge?`<span class="tag badge">${esc(person.badge)}</span>`:''}</div>
      <p>진행 비용 <strong>${won.format(person.price)}</strong><a href="${esc(person.sourceReel)}" ${linkAttrs}>원본 영상</a></p>
    </div></div></article>
    <section class="reels"><h2>대표 릴스</h2><div class="reel-grid">${cards.join('')}</div></section>${pager(index,true)}</div></div>`;
  const list = content.querySelector('.directory-list');
  const active = list?.querySelector('[aria-current="page"]');
  if (active) list.scrollTop = active.getBoundingClientRect().top - list.getBoundingClientRect().top - list.clientHeight / 2;
}
function render() {
  const index = creators.findIndex(person => route(person) === location.hash);
  const person = creators[index];
  if (person) renderProfile(person,index);
  else renderList();
  document.title = person ? person.name+' | '+heading : heading+' | Siriai';
  window.scrollTo(0,0);
  const title=content.querySelector('h1');
  title.tabIndex=-1;
  title.focus({preventScroll:true});
}
content.addEventListener('click',event=>{
  const button=event.target.closest('button[data-reel]');
  if (!button) return;
  const frame=document.createElement('iframe');
  frame.src=button.dataset.reel+'embed/';
  frame.title='인스타그램 릴스';
  frame.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';
  frame.allowFullscreen=true;
  button.replaceWith(frame);
  frame.focus();
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
